name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: mbx clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: mbx test --workspace --locked

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/setup-nasm@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p gliff-win --locked
      - run: cargo build -p gliff-win --release --locked
      # The keyboard hook must see keys typed into our own window (winit's
      # raw device input once stopped it), so Win and Alt+Tab are captured.
      - name: Check keyboard capture
        timeout-minutes: 2
        run: target/release/gliff-win.exe --probe-keys
      - name: Check install
        shell: pwsh
        run: |
          target/release/gliff-win.exe --install
          if ($LASTEXITCODE) { throw "install failed" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\gliff\gliff-win.exe")) { throw "exe not installed" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\gliff.lnk")) { throw "no Start menu shortcut" }
      - uses: actions/upload-artifact@v4
        with:
          name: gliff-win
          path: target/release/gliff-win.exe

  release:
    needs: [fmt, clippy, test, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against Cargo.toml
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: gliff-win

      - name: Publish the release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "gliff ${{ steps.version.outputs.version }}" \
            --generate-notes \
            gliff-win.exe
